name: Publish Docker Image

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: treydong/xhs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract application version
        id: vars
        run: |
          version=$(python - <<'PY'
import pathlib
import re

text = pathlib.Path('version.py').read_text()
match = re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text)
if not match:
    raise SystemExit('Unable to determine APP_VERSION from version.py')
print(match.group(1))
PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
